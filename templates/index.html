<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../static/images/favicon.ico" type="image/x-icon">

    <title>“板探智眸”人造板表面缺陷检测系统</title>
  </head>

  <body>
    <header>
      <button id="toggleButton">切换数据</button>
      <h1>“木检先锋”AI人造板表面缺陷检测系统</h1>
      <div class="showTime">当前时间：2020年3月17-0时54分14秒</div>
      <script>
        var t = null;
        t = setTimeout(time, 1000); //開始运行
        function time() {
          clearTimeout(t); //清除定时器
          dt = new Date();
          var y = dt.getFullYear();
          var mt = dt.getMonth() + 1;
          var day = dt.getDate();
          var h = dt.getHours(); //获取时
          var m = dt.getMinutes(); //获取分
          var s = dt.getSeconds(); //获取秒
          document.querySelector(".showTime").innerHTML =
            "当前时间：" +
            y +
            "年" +
            mt +
            "月" +
            day +
            "-" +
            h +
            "时" +
            m +
            "分" +
            s +
            "秒";
          t = setTimeout(time, 1000); //设定定时器，循环运行
        }
      </script>
    </header>
    <section class="mainbox">
      <div class="column">
        <div class="panel bar">
          <h2>
            缺陷数量(个)
          </h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
        <div class="panel line">
          <h2>准确率(%)</h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
        <div class="panel pie">
          <h2>检测时间(s)</h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
      </div>
      <div class="column">
        <div class="no">
          <div class="no-hd">
            <ul>
              <li id="total-quantity"></li>
              <li id="displayed-quantity"></li>
            </ul>
          </div>
          <div class="no-bd">
            <ul>
              <li>总板材量（个）</li>
              <li>完好板材量（个）</li>
            </ul>
          </div>
        </div>
        <div class="map">
          <div class="button">
            <button class="refresh-btn" onclick="refreshPage()">开始分析</button>
          </div>
          <div class="chart"></div>
          <div class="map1"></div>
          <div class="map2"></div>
          <div class="map3"></div>
        </div>
      </div>
      <div class="column">
        <div class="panel bar1">
          <h2>A B C 级木板占比</h2>
          <div class="chart" ></div>
          <div class="panel-footer"></div>
<!--{#          <button id="toggleButton"></button>#}-->
        </div>
        <div class="panel line1">
          <h2>缺陷面积(mm^2)</h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
        <div class="panel pie1">
          <h2>损伤程度</h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
      </div>
    </section>

    <script src="../static/js/flexible.js"></script>
    <script src="../static/js/echarts.min.js"></script>
    <script src="../static/js/jquery.js"></script>
    <script src="../static/js/index.js"></script>
  </body>
</html>
